<!doctype html><html lang="en-GB"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add your appointment to Calendar</title><style>body{margin:0;background:#f5f3ed;color:#292822;font:18px Arial,sans-serif}main{max-width:500px;margin:60px auto;padding:32px;background:white;border-radius:12px}a{display:inline-block;background:#292822;color:white;padding:18px;text-decoration:none;border-radius:6px}p{line-height:1.6}</style><main><h1>Add your appointment to Calendar</h1><p>Open the calendar file in Apple Calendar, Outlook or another calendar app, then save the appointment.</p><a id="download" hidden>Download appointment</a><p id="message"></p><p>Changes or cancellations will not automatically update this calendar entry.</p></main><script>
try { const bytes = Uint8Array.from(atob(decodeURIComponent(location.hash.slice(1))), c => c.charCodeAt(0)); const text = new TextDecoder().decode(bytes); if (!text.startsWith('BEGIN:VCALENDAR\r\n') || bytes.length > 20000) throw new Error(); const link = document.getElementById('download'); link.href = URL.createObjectURL(new Blob([bytes], {type:'text/calendar;charset=utf-8'})); link.download = 'sculpted-appointment.ics'; link.hidden = false; } catch { document.getElementById('message').textContent = 'This calendar link is invalid. Please use the link in your booking confirmation email.'; }
</script></html>
